[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-prize-renegade"
version = "0.0.0"
description = "Deterministic ARC-AGI research solver"
requires-python = ">=3.12"

[project.scripts]
renegade = "arc_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
